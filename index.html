<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ระบบประเมินความพึงพอใจการให้บริการพัฒนากำลังพล โรงเรียนสารบรรณ กรมสารบรรณทหารเรือ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* สไตล์สำหรับซ่อน UI ของ Google Apps Script (แถบเตือนด้านล่าง) */
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            /* ขยายความสูงเผื่อไว้ด้านล่างเพื่อดันแถบเตือนของ Google ออกนอกจอ */
            height: calc(100% + 60px);
            border: none;
            display: block;
        }
        /* Loading Screen สวยงามระหว่างรอโหลด */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e3e3e3;
            border-top: 4px solid #0056b3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text {
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            padding: 0 20px;
        }
        .loading-subtext {
            color: #666666;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- หน้าจอโหลดระบบ -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">กำลังโหลดระบบประเมินความพึงพอใจ...</div>
        <div class="loading-subtext">โรงเรียนสารบรรณ กรมสารบรรณทหารเรือ</div>
    </div>

    <!-- ส่วนแสดง Web App ผ่าน iframe เต็มจอ -->
    <div class="iframe-container">
        <iframe 
            id="app-frame"
            src="https://script.google.com/macros/s/AKfycbw-IgRi7MQNWrln0NqaWRJiEv2AyR6mt3PNNAxCJlK82XtLvH1fIhf6nhUK8XCcW-s/exec" 
            allow="fullscreen; camera; microphone; geolocation" 
            loading="eager"
            onload="hideLoading()">
        </iframe>
    </div>

    <script>
        function hideLoading() {
            const loader = document.getElementById('loading-screen');
            loader.classList.add('fade-out');
        }

        // ป้องกันกรณีโหลดค้าง ให้ซ่อน Loading อัตโนมัติใน 8 วินาที (Fallback)
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if (loader && !loader.classList.contains('fade-out')) {
                loader.classList.add('fade-out');
            }
        }, 8000);
    </script>

</body>
</html>
